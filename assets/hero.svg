<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .bg { fill: #071019; }
      .window { fill: #08121a; stroke: #0fb6d1; stroke-width: 2; rx: 8; }
      .topbar { fill: #07121a; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .mono { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #9be7ff; }
      .muted { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #6e8796; }
      .accent { fill: #6ef3c2; }
      .title { font-family: 'Courier New', Courier, monospace; font-weight:700; font-size:13px; fill:#7de3ff; }
      .label { fill: #9be564; font-family: 'Courier New', Courier, monospace; font-size:12px; }
      .value { fill: #cbe4ff; font-family: 'Courier New', Courier, monospace; font-size:12px; }
      .magenta { fill: #c792ea; }
      .tealBlock { fill: rgba(8, 21, 28, 0.45); }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" rx="0"/>

  <!-- terminal window -->
  <g transform="translate(24,24)">
    <rect class="window" x="0" y="0" width="952" height="272" rx="8"/>
    <!-- top bar buttons -->
    <g transform="translate(14,10)">
      <circle class="btn-red" cx="10" cy="8" r="6" />
      <circle class="btn-yellow" cx="30" cy="8" r="6" />
      <circle class="btn-green" cx="50" cy="8" r="6" />
    </g>

    <!-- title bar text -->
    <text x="84" y="18" class="mono">vansharmaweb ~ $ ./profile.sh --live</text>
    <text x="880" y="18" class="muted" text-anchor="end">● SCANNING</text>

    <!-- left: ascii art block -->
    <g transform="translate(28,40)">
      <rect x="0" y="0" width="420" height="220" class="tealBlock" rx="6" />
      <text x="18" y="26" class="accent">VISUAL.MAP</text>

      <text x="18" y="56" class="mono" xml:space="preserve">
        <![CDATA[
          .:::::::::::.      .:::::::::::::::.
         .:''''''''''::.  .:''  .''''''''''':.
        .:   @@@@@@    :: ::    @@@@@@      :.
       .:   @@@@@@@@   :::    @@@@@@@@      :.
       :    @@@@@@@@   :::    @@@@@@@@      :
       :    @@@@@@@    :::     @@@@@@@      :
       :    @@@@@@     :::      @@@@@@      :
       '.   @@@@@      :::       @@@@@     .'
         '.          .::' '..         .. .'
           '-._____.-'      '-._____.-'
        ]]>
      </text>
    </g>

    <!-- right: system info -->
    <g transform="translate(470,48)">
      <rect x="0" y="0" width="430" height="220" fill="none" />

      <text x="8" y="22" class="title">[ SYSTEM INFO ]</text>

      <text x="8" y="48" class="label">Subject .............</text>
      <text x="220" y="48" class="value">Vansh Sharma</text>

      <text x="8" y="68" class="label">Role ................</text>
      <text x="220" y="68" class="value">Student · Developer</text>

      <text x="8" y="88" class="label">Origin ..............</text>
      <text x="220" y="88" class="value">PSIT Kanpur · AKTU</text>

      <text x="8" y="108" class="label">Education ...........</text>
      <text x="220" y="108" class="value">B.Tech CSE (2nd Year)</text>

      <text x="8" y="128" class="label">Status ..............</text>
      <text x="220" y="128" class="value">Building · Learning</text>

      <text x="8" y="148" class="label">Toolchain ...........</text>
      <text x="220" y="148" class="value">Flask · React · C++ · Git</text>

      <text x="8" y="168" class="label">Interests ...........</text>
      <text x="220" y="168" class="value">Web · Systems · Tooling</text>

      <text x="8" y="196" class="magenta">// CONTACT</text>
      <text x="8" y="212" class="label">Mail ...............</text>
      <text x="220" y="212" class="value">vanshsharmaweb@gmail.com</text>

      <text x="8" y="232" class="label">GitHub .............</text>
      <text x="220" y="232" class="value">github.com/vansharmaweb</text>

    </g>
  </g>

</svg>
