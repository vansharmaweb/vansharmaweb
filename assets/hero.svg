<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <style>
      .bg{fill:url(#g)}
      .txt{font-family: 'Segoe UI', Roboto, system-ui, -apple-system; fill:#9bd1ff}
      .muted{fill:#7b8794}
      .cursor{fill:#9bd1ff}
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%" rx="12"/>
  <g transform="translate(36,36)">
    <rect x="0" y="0" width="560" height="140" rx="8" fill="#071428" opacity="0.6" />
    <text x="24" y="36" class="txt" font-size="20">Hi — I’m Vansh Sharma</text>
    <text x="24" y="62" class="muted" font-size="13">B.Tech CSE · Builder of playful web apps · | Flask · React · C++</text>

    <g transform="translate(24,86)">
      <rect x="0" y="0" width="420" height="26" rx="4" fill="#071428" />
      <text x="12" y="18" class="txt" font-size="13">Building: QuestLink · DevCard Generator · Portfolio Generator</text>
    </g>

    <!-- animated terminal cursor -->
    <g transform="translate(600,24)">
      <rect x="0" y="0" width="140" height="140" rx="8" fill="#081226"/>
      <text x="18" y="40" class="txt" font-size="14">&gt; git status</text>
      <text x="18" y="64" font-size="13" fill="#7b8794">On branch main</text>
      <rect x="18" y="72" width="8" height="14" class="cursor">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
